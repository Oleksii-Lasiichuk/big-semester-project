resources:
  jobs:
    airwar_pipeline:
      name: airwar_pipeline
      parameters:
        - name: only
          default: reference,alerts,telegram,af,weather,validate
      tasks:
        - task_key: bronze_silver
          environment_key: default
          spark_python_task:
            python_file: ../scripts/run_pipeline.py
            parameters: ["--only", "{{job.parameters.only}}", "--root", "${workspace.file_path}"]
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - astral
